name: One-time completed-branch cleanup (Fallout2-EtTu-KR)
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cleanup-completed-branches-once.yml'
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'munument1/Fallout2-EtTu-KR'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const targets=[{"name":"agent/korean-gdi-font","sha":"cf595081bd1f128862e117ce7ee31e0df5b197d7","pr":1},{"name":"codex/ettu-2.0-korean","sha":"5db6e4dd82370e903098d71221fe3ec773039282","pr":3},{"name":"codex/ettu-2.0-release","sha":"7b00d9586b771dc695d324726592f0d38b3ffb7b","pr":4},{"name":"codex/native-korean-engine-20261017","sha":"258956ca3c035d225e40e39be267b45d76076f30","pr":5},{"name":"codex/shared-korean-engine","sha":"4184744af228a98e3da323f00bdf814196ebf62d","pr":2}];
            const owner=context.repo.owner,repo=context.repo.repo;
            if(owner!=='munument1'||repo!=="Fallout2-EtTu-KR"||context.ref!=="refs/heads/master")throw Error('Wrong repository or branch');
            const open=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            const blocked=new Set(open.flatMap(p=>[p.head.ref,p.base.ref]));
            let deleted=0;const skipped=[];
            for(const c of targets){
             if(c.name==="master"||c.name==='gh-pages'||blocked.has(c.name)){skipped.push(c.name+': policy/PR');continue;}
             let b;try{b=(await github.rest.repos.getBranch({owner,repo,branch:c.name})).data}catch(e){skipped.push(c.name+': missing');continue;}
             if(b.protected||b.commit.sha!==c.sha){skipped.push(c.name+': changed/protected');continue;}
             if(c.pr!==null){
              const p=(await github.rest.pulls.get({owner,repo,pull_number:c.pr})).data;
              if(!p.merged_at||p.base.ref!=="master"||p.head.ref!==c.name||p.head.sha!==c.sha){skipped.push(c.name+': PR changed');continue;}
             }else{
              const cmp=(await github.rest.repos.compareCommitsWithBasehead({owner,repo,basehead:"master..."+c.name})).data;
              if(cmp.ahead_by!==0){skipped.push(c.name+': unique commits');continue;}
             }
             await github.rest.git.deleteRef({owner,repo,ref:'heads/'+c.name});
             deleted++;core.info('DELETED '+c.name);
            }
            for(const s of skipped)core.warning('SKIPPED '+s);
            core.info('Completed '+deleted+' deletions of '+targets.length+' candidates; '+skipped.length+' skipped');
            await core.summary.addHeading('Completed branch cleanup').addRaw('Deleted '+deleted+' of '+targets.length+'; skipped '+skipped.length+'.').write();
